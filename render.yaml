# Render Blueprint Configuration for SIH26108 Project
# Target: Render $0 Free Tier ONLY
# Backend: FastAPI Web Service (512 MB RAM / 0.1 CPU limit)
# Frontend: React Vite Static Site (type: web, runtime: static)

services:
  - type: web
    name: sih26108-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: REPOSITORY_TYPE
        value: json
      - key: VECTOR_BACKEND
        value: faiss
      - key: EMBEDDING_MODEL
        value: intfloat/multilingual-e5-small
      - key: RERANK_ENABLED
        value: "false"
      - key: HF_TOKEN
        sync: false

  - type: web
    name: sih26108-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
